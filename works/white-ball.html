<!doctype html>
<!--
  WHITE BALL — series 01. One white ball runs through a sequence of art styles; the page scrolls, the ball rolls on.
  Each chapter changes only what the ball can plausibly be affected by: LIGHT, MATERIAL, MOTION. The shape never changes.
  01 Microbiology  — translucent membrane, soft backlight, floats and wobbles
  02 Gzhel         — glazed porcelain painted cobalt, warm softbox, heavy and slow
  03 Cyberpunk     — chrome with lit circuit lines, magenta/cyan neon, glitching
  three.js is bundled inline; fonts come from Google Fonts and fall back to system faces offline.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WHITE BALL — series 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#e3f6ef;--mute:#8fbbad;--rule:#e3f6ef2e;--accent:#7fe0c4;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace}
body[data-ch="0"]{--ink:#e3f6ef;--mute:#8fbbad;--rule:#e3f6ef2e;--accent:#7fe0c4}
body[data-ch="1"]{--ink:#142a78;--mute:#4a5a98;--rule:#142a7833;--accent:#1f3fa8}
body[data-ch="2"]{--ink:#f4e9ff;--mute:#b9a3d9;--rule:#f4e9ff33;--accent:#12d9ff}
*{box-sizing:border-box}
html,body{margin:0}
body{height:560vh;background:#0b1b18;color:var(--ink);font-family:var(--sans);transition:color .5s}
#stage{position:fixed;inset:0;overflow:hidden}
#bg,#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.3;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#scan{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,#0000 0 2px,#0006 2px 3px)}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;pointer-events:none;z-index:5;transition:color .5s}
.hud b{font-weight:500;color:var(--accent)}
#rail{position:fixed;left:22px;top:50%;transform:translateY(-50%);height:132px;width:2px;background:var(--rule);z-index:5}
#prog{position:absolute;inset:0;background:var(--accent);transform-origin:top;transform:scaleY(0)}
.tick{position:absolute;left:-4px;width:10px;height:2px;background:var(--mute);opacity:.6}
.tick:nth-child(2){top:0}.tick:nth-child(3){top:50%}.tick:nth-child(4){top:100%}
.tick.on{background:var(--accent);opacity:1;width:16px}
#caption{position:fixed;z-index:5;pointer-events:none;transition:opacity .18s,transform .18s}
#caption.swap{opacity:0;transform:translateY(6px)}
#caption{left:72px;bottom:9vh;width:min(380px,32vw)}
body[data-ch="1"] #caption{left:auto;right:56px;text-align:right;width:min(380px,32vw)}
body[data-ch="1"] #caption dl{margin-left:auto}
#name{margin:6px 0 0;font:300 clamp(40px,6vw,92px)/.92 var(--sans);letter-spacing:-.03em}
body[data-ch="1"] #name{font:italic 500 clamp(48px,7vw,108px)/.9 var(--serif);letter-spacing:-.01em}
body[data-ch="2"] #name{font:500 clamp(32px,4.6vw,70px)/.95 var(--mono);text-transform:uppercase;letter-spacing:-.04em;text-shadow:2px 0 #ff2fb3,-2px 0 #12d9ff}
#line{margin:14px 0 20px;font:400 15px/1.35 var(--sans);color:var(--mute)}
body[data-ch="1"] #line{font:italic 500 19px/1.3 var(--serif)}
body[data-ch="2"] #line{font:400 12px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.cnum{font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--accent)}
dl{margin:0;display:grid;gap:9px;max-width:330px}
dl div{display:grid;grid-template-columns:62px 1fr;gap:10px;padding-top:9px;border-top:1px solid var(--rule)}
body[data-ch="1"] dl div{grid-template-columns:1fr 62px}
body[data-ch="1"] dt{order:2}
dt{font:500 10px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
dd{margin:0;font:400 12.5px/1.45 var(--sans)}
body[data-ch="1"] dd{text-align:right}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font:500 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);z-index:5;pointer-events:none;animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(-50%,5px)}}
@media (max-width:760px){
  #caption,body[data-ch="1"] #caption{left:20px;right:20px;bottom:calc(30px + 2vh);width:auto;text-align:left}
  body[data-ch="1"] dl div{grid-template-columns:62px 1fr}body[data-ch="1"] dt{order:0}body[data-ch="1"] dd{text-align:left}
  #name{font-size:clamp(34px,11vw,52px)}body[data-ch="1"] #name{font-size:clamp(42px,13vw,64px)}body[data-ch="2"] #name{font-size:clamp(28px,8.5vw,44px)}
  #line{margin:8px 0 12px}dl{gap:6px;max-width:none}dl div{padding-top:6px}dd{font-size:12px;line-height:1.35}
  #rail,#hint{display:none}
}
@media (prefers-reduced-motion:reduce){#hint{animation:none}}
</style>
</head>
<body data-ch="0">
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="grain"></div>
  <canvas id="gl"></canvas>
  <div id="scan"></div>
</div>
<div class="hud"><span>White Ball <b>/ series 01</b></span><span>Chapter <b id="cnum">01</b> / 03</span></div>
<div id="rail"><div id="prog"></div><i class="tick on"></i><i class="tick"></i><i class="tick"></i></div>
<section id="caption" aria-live="polite">
  <div class="cnum">&nbsp;</div>
  <h1 id="name">Microbiology</h1>
  <p id="line">A cell, before it is anything.</p>
  <dl>
    <div><dt>Light</dt><dd id="light"></dd></div>
    <div><dt>Material</dt><dd id="mat"></dd></div>
    <div><dt>Motion</dt><dd id="move"></dd></div>
  </dl>
</section>
<div id="hint">Scroll</div>
