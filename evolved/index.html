<!doctype html>
<!--
  REGULA / EVOLVED — a standard for selection.
  Every letter is a population of sixteen stroke genomes (nodes joined by tapered Bezier strokes) bred without end by a
  genetic algorithm. A small neural reader (MLP 400-72-37), trained in this page on rasters of very different faces,
  judges how surely each individual reads as its letter; fitness = reading x a target band of strangeness. Generations
  tick by on their own; a visitor's picks breed more and never die. The four weights are four depths of one lineage:
  the individual alone, then 4, 9 and 20 generations of its ancestors overprinted beneath it.
  Every word on this page is set in Evolved itself: the current champions form a live atlas, redrawn as they change.
  Before the atlas is drawn, and for assistive technology, the words are real text in Jost (site series face).
  The second stylesheet loads training faces only: they are rasterised for the reader and never shown as text;
  offline, system faces and a built-in stroke set train the reader instead.
-->

  var cols=narrow?8:16,gx=narrow?10:28,gw=W-gx*2,cw=gw/cols,rows=16/cols,chh=Math.min(cw*1.4,H*(narrow?.14:.22)),popH=rows*chh,py=H-popH-(narrow?10:22);
