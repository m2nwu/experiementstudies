<!doctype html>
<!--
  M2NWU / MOTION SYSTEM
  One brand device: sunlight refracted through computed glass (the Caustic engine, running live).
  Every panel below is the same optics: an inverse-caustic glass surface solved once in the browser,
  then a mesh of rays refracted through it on the GPU in three spectral bands, every frame.
  Panels differ only in what the glass was solved for, how it is tilted / rippled, and how the light
  is mapped (natural or thermal) and masked. Two field colours (INK, COBALT) + light as the effect colour.
  One shared 8 s clock, four 2 s beats; cuts land on beats.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M2NWU — MOTION SYSTEM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* field colours: the only two grounds in the system */
  --ink:#05070f;
  --cobalt:#1c2bff;
  /* effect colour: light (natural) */
  --light:#f3fbff;
  --halo:#9fe9ff;
  /* effect colour: light (thermal ramp, intensity 0 -> 1) */
  --heat0:#05070f;--heat1:#1c2bff;--heat2:#14d2ff;--heat3:#d6ff3d;--heat4:#ffffff;
  --display:'Syne','Arial Black','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --bar:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--light);overflow:hidden}
body{font-family:var(--mono);text-transform:uppercase;-webkit-font-smoothing:antialiased}
#gl{position:fixed;left:0;top:0;width:100vw;height:calc(100% - var(--bar));display:block;z-index:0;pointer-events:none}
.reel{position:absolute;left:0;top:0;right:0;bottom:var(--bar);display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;z-index:1}
.reel::-webkit-scrollbar{display:none}
.pn{position:relative;flex:1 0 0;min-width:0;height:100%;scroll-snap-align:start;overflow:hidden;border-right:1px solid rgba(5,7,15,.9)}
.pn:last-child{border-right:0}
.pn[data-p=logo]{flex-grow:1.45}
.nogl .pn{background:var(--f,var(--ink))}
.tag{position:absolute;font-size:9px;letter-spacing:.08em;line-height:1;opacity:.82;white-space:nowrap}
.tl{left:12px;top:12px}.tr{right:12px;top:12px}.bl{left:12px;bottom:12px}.br{right:12px;bottom:12px}
.emb{position:absolute;left:50%;top:9%;width:30px;height:30px;transform:translateX(-50%)}
.tagline{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-size:10px;letter-spacing:.32em}
/* data layer */
.data .row{position:absolute;left:12px;right:12px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.06em;line-height:1}
.data .row b{font-weight:600}
.data .box{border:1px solid currentColor;padding:2px 3px;margin:-3px 0}
.win{position:absolute;border:1px solid rgba(243,251,255,.55)}
.win i{position:absolute;width:5px;height:5px;border-color:var(--light);border-style:solid}
.win .c1{left:-3px;top:-3px;border-width:1px 0 0 1px}.win .c2{right:-3px;top:-3px;border-width:1px 1px 0 0}
.win .c3{left:-3px;bottom:-3px;border-width:0 0 1px 1px}.win .c4{right:-3px;bottom:-3px;border-width:0 1px 1px 0}
.xh{position:absolute;width:15px;height:15px;margin:-7px 0 0 -7px;pointer-events:none}
.xh:before,.xh:after{content:'';position:absolute;background:var(--light)}
.xh:before{left:7px;top:0;width:1px;height:15px}.xh:after{top:7px;left:0;height:1px;width:15px}
.xh span{position:absolute;left:12px;top:-11px;font-size:8px;letter-spacing:.04em}
.ruler{position:absolute;left:12px;right:12px;height:22px}
.ruler .tk{position:absolute;bottom:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 10%)}
.ruler .tk2{position:absolute;bottom:0;left:5%;right:0;height:3px;background:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 10.53%)}
.ruler .nm{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;font-size:8px}
.bars{position:absolute;left:12px;right:12px;display:flex;gap:6px;align-items:center;font-size:9px}
.bars u{display:block;flex:0 0 34px;height:8px;border:1px solid currentColor;position:relative;text-decoration:none}
.bars u s{position:absolute;left:0;top:0;bottom:0;background:currentColor;width:0}
.bars em{font-style:normal;margin-left:auto}
.bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);display:flex;align-items:center;gap:18px;padding:0 12px;font-size:9px;letter-spacing:.08em;background:var(--ink);border-top:1px solid rgba(243,251,255,.14);z-index:2;white-space:nowrap;overflow:hidden}
.bar b{font-weight:600}
.sw{display:inline-flex;align-items:center;gap:6px}
.sw i{display:inline-block;width:10px;height:10px;border:1px solid rgba(243,251,255,.3)}
.ramp{display:inline-block;width:46px;height:10px;background:linear-gradient(90deg,var(--heat0),var(--heat1),var(--heat2),var(--heat3),var(--heat4))}
.beats{display:inline-flex;gap:3px;margin-left:auto}
.beats i{display:inline-block;width:14px;height:6px;border:1px solid var(--light)}
.beats i.on{background:var(--light)}
.clk{min-width:120px;text-align:right}
@media (max-width:900px){.sw.hide{display:none}}
@media (max-width:760px){
  .pn{flex:0 0 76vw}
  .bar{gap:12px}.bar .hide2{display:none}
}
</style>

<body>
<canvas id="gl" aria-hidden="true"></canvas>
<main class="reel" id="reel" aria-label="M2NWU motion system: six live panels">
  <section class="pn" data-p="logo" style="--f:var(--ink)">
    <span class="tag tl">01</span><span class="tag tr">LOGO</span>
    <canvas class="emb" width="60" height="60" aria-hidden="true"></canvas>
    <h1 class="tagline" aria-label="M2NWU. Bend the light.">BEND THE LIGHT</h1>

  <section class="pn" data-p="emblem" style="--f:var(--cobalt)">

  </section>
  <section class="pn data" data-p="data" style="--f:var(--cobalt)">
    <div class="row" style="top:12px"><b class="box">M2NWU</b><span>05</span><span>DATA</span></div>
    <div class="row" style="top:34px"><span>GLASS</span><span>CROWN</span><span>N 1.522</span></div>
    <div class="row" style="top:50px"><span>ABBE V</span><span>58.6</span><span>BANDS R G B</span></div>
    <div class="row" id="rowFocus"><span>FOCUS</span><span id="fx">X 0.000</span><span id="fy">Y 0.000</span></div>
    <div class="row" id="rowTilt"><span>TILT</span><span id="tx">0.00&deg;</span><span id="ty">0.00&deg;</span></div>

    <div class="bars" id="bars"><u><s></s></u><u><s></s></u><u><s></s></u><em id="tclk">T 0.00</em></div>

</main>

  <b>M2NWU</b><span class="hide2">MOTION SYSTEM</span>

  <span class="clk" id="clk">T 0.000 / 8.000</span>

<script>/* ---------------------------------------------------------------
   INVERSE CAUSTIC SOLVER (runs in a Web Worker; also usable inline)
   1. Transport by redistribution: a (nx+1)x(ny+1) mesh on the glass
      is relaxed so each cell's area equals the target brightness of
      the floor pixel it must light (light in = area, uniform sun).
      Each pass solves a Neumann Poisson equation  lap(phi) = t - a
      with a DCT and moves vertices along grad(phi), with the step
      clipped so no triangle inverts (after M. Ferraro's method; a
      discrete approximation of the Monge-Ampere / optimal-transport
      problem, not an exact solution).
   2. The inverse map is rasterised back onto a regular glass grid,
      Snell's law (top face sculpted, bottom face flat) gives the
      surface slope each point needs to reach its floor point.
   3. The slope field is integrated into a height field by a second
      least-squares Poisson solve; the curl it cannot honour is
      reported as the integrability residual.
---------------------------------------------------------------- */
function makeSolverAPI(){
  var mats={};
  function dctMat(N){
    if(mats[N])return mats[N];
    var C=new Float64Array(N*N);
    for(var k=0;k<N;k++){var a=k===0?Math.sqrt(1/N):Math.sqrt(2/N);
      for(var n=0;n<N;n++)C[k*N+n]=a*Math.cos(Math.PI*(n+.5)*k/N)}
    return mats[N]=C;
  }
  // Solve 5-point Neumann Laplacian lap(u)=f on ny x nx grid (row-major). Mean of u = 0.
  function poisson(f,nx,ny,out){
    var Cx=dctMat(nx),Cy=dctMat(ny),A=new Float64Array(nx*ny),B=new Float64Array(nx*ny),i,j,k,s,row,crow;
    // A = f * Cx^T   (A[y][l] = sum_x f[y][x] Cx[l][x])
    for(j=0;j<ny;j++){row=j*nx;for(k=0;k<nx;k++){crow=k*nx;s=0;for(i=0;i<nx;i++)s+=f[row+i]*Cx[crow+i];A[row+k]=s}}
    // B = Cy * A     (B[m][l] = sum_y Cy[m][y] A[y][l])
    B.fill(0);
    for(k=0;k<ny;k++){var bo=k*nx;for(j=0;j<ny;j++){var c=Cy[k*ny+j];if(c===0)continue;var ao=j*nx;for(i=0;i<nx;i++)B[bo+i]+=c*A[ao+i]}}
    for(k=0;k<ny;k++){var ly=2*Math.cos(Math.PI*k/ny)-2;for(i=0;i<nx;i++){var lx=2*Math.cos(Math.PI*i/nx)-2,d=lx+ly;B[k*nx+i]=d===0?0:B[k*nx+i]/d}}
    // inverse: A = Cy^T * B ; out = A * Cx
    A.fill(0);
    for(k=0;k<ny;k++){var bo2=k*nx;for(j=0;j<ny;j++){var c2=Cy[k*ny+j];if(c2===0)continue;var ao2=j*nx;for(i=0;i<nx;i++)A[ao2+i]+=c2*B[bo2+i]}}
    out=out||new Float64Array(nx*ny);out.fill(0);
    for(j=0;j<ny;j++){row=j*nx;for(k=0;k<nx;k++){var av=A[row+k];if(av===0)continue;crow=k*nx;for(i=0;i<nx;i++)out[row+i]+=av*Cx[crow+i]}}
    return out;
  }
  function triArea(ax,ay,bx,by,cx,cy){return .5*((bx-ax)*(cy-ay)-(cx-ax)*(by-ay))}
  // smallest positive t where area(p+t v) of triangle hits 0
  function tCollapse(p,v,a,b,c){
    var ax=p[a*2],ay=p[a*2+1],bx=p[b*2],by=p[b*2+1],cx=p[c*2],cy=p[c*2+1];
    var avx=v[a*2],avy=v[a*2+1],bvx=v[b*2],bvy=v[b*2+1],cvx=v[c*2],cvy=v[c*2+1];
    var e1x=bx-ax,e1y=by-ay,e2x=cx-ax,e2y=cy-ay,d1x=bvx-avx,d1y=bvy-avy,d2x=cvx-avx,d2y=cvy-avy;
    var A=d1x*d2y-d2x*d1y,B=e1x*d2y+d1x*e2y-e2x*d1y-d2x*e1y,C=e1x*e2y-e2x*e1y; // 2*area(t)=A t^2+B t+C, C>0
    var best=Infinity;
    if(Math.abs(A)<1e-12){if(B<0)best=-C/B}
    else{var D=B*B-4*A*C;if(D>=0){var q=Math.sqrt(D),t1=(-B-q)/(2*A),t2=(-B+q)/(2*A);if(t1>1e-9)best=Math.min(best,t1);if(t2>1e-9)best=Math.min(best,t2)}}
    return best;
  }
  /* job: {nx,ny,t:Float32Array(nx*ny) target, ior, cs:cell size(world), T:thickness, Hp:floor distance, iters}
     returns a stepper: step() -> {it,res}; field() -> Float32Array((nx+1)(ny+1)*4) [hx,hy,h,ior] */
  /* job: {nx,ny,t:Float32Array(nx*ny) coverage 0..1, floor, ior, cs:cell size (world), T:glass thickness, Hp:floor distance}
     The glass is a regular (nx+1)x(ny+1) grid; each glass cell carries one unit of sunlight.
     A mesh on the FLOOR (vertex k = where glass vertex k lands) is relaxed until every floor
     cell holds exactly one unit of target brightness: cells shrink inside the letter, swell outside. */
  function createJob(job){
    // coarse-to-fine: large plates first relax on a half-resolution grid
    if(job.nx*job.ny>9000&&!job._fine){
      var nx2=Math.ceil(job.nx/2),ny2=Math.ceil(job.ny/2),tc=new Float32Array(nx2*ny2),cnt=new Float32Array(nx2*ny2);
      for(var y=0;y<job.ny;y++)for(var x=0;x<job.nx;x++){var o=(y>>1)*nx2+(x>>1);tc[o]+=job.t[y*job.nx+x];cnt[o]++}
      for(var z=0;z<tc.length;z++)tc[z]/=cnt[z];
      var cj={};for(var key in job)cj[key]=job[key];cj.nx=nx2;cj.ny=ny2;cj.t=tc;cj.cs=job.cs*job.nx/nx2;cj._fine=1;
      var coarse=createJob(cj),fine=null,nC=job.coarseIters||Math.round((job.iters||60)*.6),total=0;
      return {step:function(){
          total++;
          if(!fine){var r=coarse.step();if(coarse.it>=nC){var fj={};for(var key2 in job)fj[key2]=job[key2];fj._fine=1;fj.init=coarse.P();fj.initN=[nx2,ny2];fine=createJob(fj)}return r}
          return fine.step()},
        field:function(){return fine?fine.field():coarse.field()},
        level:function(){return fine?1:0},
        get it(){return total},get res(){return fine?fine.res:coarse.res}};
    }
    var nx=job.nx,ny=job.ny,NX=nx+1,NY=ny+1,NV=NX*NY,P=new Float64Array(NV*2),V=new Float64Array(NV*2);
    for(var j=0;j<=ny;j++)for(var i=0;i<=nx;i++){var q=(j*NX+i)*2;P[q]=i;P[q+1]=j}
    if(job.init){ // upsample a coarse floor mesh
      var cnx=job.initN[0],cny=job.initN[1],CI=job.init,CX=cnx+1,sx=cnx/nx,sy=cny/ny;
      for(var j0=0;j0<=ny;j0++)for(var i0=0;i0<=nx;i0++){
        var gx=Math.min(cnx-1e-9,i0*sx),gy=Math.min(cny-1e-9,j0*sy),ci=gx|0,cj2=gy|0,fx=gx-ci,fy=gy-cj2,c0=(cj2*CX+ci)*2;
        var px=(CI[c0]*(1-fx)+CI[c0+2]*fx)*(1-fy)+(CI[c0+CX*2]*(1-fx)+CI[c0+CX*2+2]*fx)*fy;
        var py=(CI[c0+1]*(1-fx)+CI[c0+3]*fx)*(1-fy)+(CI[c0+CX*2+1]*(1-fx)+CI[c0+CX*2+3]*fx)*fy;
        var q0=(j0*NX+i0)*2;P[q0]=i0===0?0:i0===nx?nx:px/sx;P[q0+1]=j0===0?0:j0===ny?ny:py/sy;
      }
      job.floor0=job.floor;
    }
    var t=new Float64Array(nx*ny),k,fl0=job.floor0||.35,fl1=job.floor||.05,curFloor=-1;
    function setFloor(fl){if(Math.abs(fl-curFloor)<1e-6)return;curFloor=fl;var sum=0;
      for(k=0;k<nx*ny;k++){t[k]=fl+(1-fl)*job.t[k];sum+=t[k]}var sc=nx*ny/sum;for(k=0;k<nx*ny;k++)t[k]*=sc}
    function tAt(x,y){ // bilinear sample of target brightness; (x,y) in floor-cell units
      x-=.5;y-=.5;if(x<0)x=0;if(y<0)y=0;if(x>nx-1.0001)x=nx-1.0001;if(y>ny-1.0001)y=ny-1.0001;
      var i=x|0,j=y|0,fx=x-i,fy=y-j,o=j*nx+i;
      if(nx===1||ny===1)return t[o];
      return (t[o]*(1-fx)+t[o+1]*fx)*(1-fy)+(t[o+nx]*(1-fx)+t[o+nx+1]*fx)*fy;
    }
    var L=new Float64Array(nx*ny),phi=new Float64Array(nx*ny),it=0,res=1,SUB=[.17,.5,.83];
    function vid(i,j){return j*NX+i}
    function loss(){
      var m=0;
      for(var j=0;j<ny;j++)for(var i=0;i<nx;i++){
        var a=vid(i,j)*2,b=vid(i+1,j)*2,c=vid(i+1,j+1)*2,d=vid(i,j+1)*2;
        var ar=triArea(P[a],P[a+1],P[b],P[b+1],P[c],P[c+1])+triArea(P[a],P[a+1],P[c],P[c+1],P[d],P[d+1]);
        var acc=0;
        for(var sy=0;sy<3;sy++)for(var sx=0;sx<3;sx++){var u=SUB[sx],v=SUB[sy];
          var x=(P[a]*(1-u)+P[b]*u)*(1-v)+(P[d]*(1-u)+P[c]*u)*v,y=(P[a+1]*(1-u)+P[b+1]*u)*(1-v)+(P[d+1]*(1-u)+P[c+1]*u)*v;acc+=tAt(x,y)}
        var mass=ar*acc/9,l=1-mass;L[j*nx+i]=l;m+=Math.abs(l);
      }
      return m/(nx*ny);
    }
    function step(){
      setFloor(Math.max(fl1,fl0*Math.pow(job.decay||.84,it)));
      res=loss();
      poisson(L,nx,ny,phi);
      for(var j=0;j<=ny;j++)for(var i=0;i<=nx;i++){
        var q=vid(i,j)*2,vx=0,vy=0,n,r;
        if(i>0&&i<nx){n=0;for(r=j-1;r<=j;r++){if(r<0||r>=ny)continue;vx+=phi[r*nx+i]-phi[r*nx+i-1];n++}vx/=n}
        if(j>0&&j<ny){n=0;for(r=i-1;r<=i;r++){if(r<0||r>=nx)continue;vy+=phi[j*nx+r]-phi[(j-1)*nx+r];n++}vy/=n}
        V[q]=vx;V[q+1]=vy;
      }
      var tmin=Infinity;
      for(var j2=0;j2<ny;j2++)for(var i2=0;i2<nx;i2++){
        var a=vid(i2,j2),b=vid(i2+1,j2),c=vid(i2+1,j2+1),d=vid(i2,j2+1);
        var t1=tCollapse(P,V,a,b,c),t2=tCollapse(P,V,a,c,d);if(t1<tmin)tmin=t1;if(t2<tmin)tmin=t2;
      }
      var dt=Math.min(1,tmin*.5);
      for(k=0;k<NV*2;k++)P[k]+=V[k]*dt;
      it++;
      return {it:it,res:res,dt:dt,floor:curFloor};
    }
    function field(){
      var n=job.ior,T=job.T,Hp=job.Hp,cs=job.cs,smax=1/n-1e-4;
      var GX=new Float64Array(NV),GY=new Float64Array(NV);
      for(var id=0;id<NV;id++){
        var x=id%NX,y=(id/NX)|0,dx=(P[id*2]-x)*cs,dy=(P[id*2+1]-y)*cs,D=Math.sqrt(dx*dx+dy*dy);
        if(D<1e-12){GX[id]=0;GY[id]=0;continue}
        // f(s)= s/sqrt(1-s^2)*T + n s/sqrt(1-n^2 s^2)*Hp = D   (s = sine of the ray inside the glass)
        var lo=0,hi=smax;for(var it2=0;it2<40;it2++){var s=(lo+hi)/2,f=s/Math.sqrt(1-s*s)*T+n*s/Math.sqrt(1-n*n*s*s)*Hp;if(f<D)lo=s;else hi=s}
        var s2=(lo+hi)/2,nz=Math.max(.05,n*Math.sqrt(1-s2*s2)-1);
        GX[id]=n*s2*dx/D/nz;GY[id]=n*s2*dy/D/nz;
      }
      var f2=new Float64Array(NV);
      for(var y2=0;y2<NY;y2++)for(var x2=0;x2<NX;x2++){
        var id2=y2*NX+x2,dv=0;
        if(x2<NX-1)dv+=(GX[id2]+GX[id2+1])*.5;if(x2>0)dv-=(GX[id2]+GX[id2-1])*.5;
        if(y2<NY-1)dv+=(GY[id2]+GY[id2+NX])*.5;if(y2>0)dv-=(GY[id2]+GY[id2-NX])*.5;
        f2[id2]=dv*cs;
      }
      var h=poisson(f2,NX,NY);
      var out=new Float32Array(NV*4),e2=0,g2=0,hmin=Infinity,hmax=-Infinity;

/* ---------------------------------------------------------------
   3. PANELS — one engine, six formats, one clock
---------------------------------------------------------------- */
var WORD=null,EMB=null,PANELS=[],DPR=1,RQ=1;

/* while a plate is still being solved it carries a strong ripple: the light web is visible from frame one */
function unsolved(pl){var f=pl.done?sm(0,1400,performance.now()-pl.solvedAt):0;return 1-f}
function sunAt(sx,sy){return nrm([Math.tan(sx),Math.tan(sy),-1])}

var DEF={
  logo:{still:.9,state:function(P,t){
    var pl=WORD,ph=t/CYCLE,cut=t>=4,smear=bump(t,1.25,2.2,3.5,4.7),sm2=bump(t,6.1,6.6,7.0,7.8);
    var W=P.w*1.02,rc=glassAt(pl,P,P.w/2,P.h*.5,W),m=solvedMesh(pl,rc),un=unsolved(pl);

    return {R:rotMat(tx,ty),sun:sunAt(.012*Math.sin(TAU*ph),.01*Math.cos(TAU*ph)),focus:smear,
      plates:[{pl:pl,rect:rc,mx:m[0],my:m[1],fk:1+.45*smear,edge:.16,wave:{dir:.012+.05*smear+.5*un,lam:Math.max(40,rc.H*.9),ph:ph,seed:1.3}}],
      comp:{G:cut?TOK.cobalt:TOK.ink,tint:TOK.halo,halo:cut?.4:.6,exp:.4}};
  }},
  emblem:{still:2.9,state:function(P,t){
    var pl=EMB,ph=t/CYCLE,cut=t>=4,tb=t%4,rip=bump(tb,.18,.5,.75,2.1),un=unsolved(pl);

      plates:[{pl:pl,rect:rc,mx:m[0],my:m[1],fk:1+.12*rip,edge:.1,wave:{dir:.01+.5*un,rad:.05*rip,lam:W*.5,lamR:W*.16,rx:0,ry:0,rp:TAU*(tb*1.6),ph:ph,seed:2.1}}],
      comp:{G:cut?TOK.ink:TOK.cobalt,tint:TOK.halo,halo:.5,exp:cut?.4:.5}};
  }},
  field:{still:3.1,state:function(P,t){
    var ph=t/CYCLE,b=Math.floor(t/BEAT),tb=t-b*BEAT,thermal=(b===1||b===2),env=sm(0,.12,tb)*Math.exp(-tb*1.25);
    var C=[[.18,-.22],[-.2,.12],[.22,.2],[-.12,-.06]][b];
    var rc={cx:P.w/2,cy:P.h/2,W:P.w*1.3,H:P.h*1.12},m=waveMesh(P,2);
    return {R:rotMat(.02*Math.sin(TAU*ph),.015*Math.sin(2*TAU*ph)),sun:sunAt(0,0),
      plates:[{pl:FLAT,rect:rc,mx:m[0],my:m[1],hp:Math.min(P.w,P.h)*1.1,wave:{dir:.34,rad:.42*env,lam:Math.max(150,P.w*.62),lamR:Math.max(60,P.w*.2),rx:C[0]*P.w,ry:C[1]*P.h,rp:tb*7.5,ph:ph,seed:.4}}],

/* type masks: giant stacked letters (one period = two lines, repeats vertically), tagline */
var mc=document.createElement('canvas'),mx2=mc.getContext('2d');

  [['NWU',0],['M2',1]].forEach(function(L){var tw=mx2.measureText(L[0]).width,x=L[0]==='M2'?-tw*.08:-tw*.02;mx2.fillText(L[0],x,L[1]*pitch+(pitch+cap)/2)});

function tagMask(P){

/* ---------------------------------------------------------------
   4. LAYOUT / LOOP
---------------------------------------------------------------- */
var reel=$('#reel'),CW=1,CH=1,fontReady=false;
function setupPanels(){
  PANELS=[].map.call(document.querySelectorAll('.pn'),function(el){return {el:el,k:el.getAttribute('data-p'),def:DEF[el.getAttribute('data-p')],T:null,w:1,h:1,mask:null,rep:1,maskKey:''}});
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);RQ=Math.min(window.devicePixelRatio||1,1.25);
  var r=reel.getBoundingClientRect();CW=Math.max(1,Math.round(innerWidth));CH=Math.max(1,Math.round(r.height));
  if(!gl)return;
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  PANELS.forEach(function(P){
    var b=P.el.getBoundingClientRect(),w=Math.max(1,Math.round(b.width)),h=Math.max(1,Math.round(b.height));
    if(P.T&&P.w===w&&P.h===h)return;P.w=w;P.h=h;
    if(P.T){freeRT(P.T.acc);freeRT(P.T.h1);freeRT(P.T.h2)}
    var aw=Math.max(8,Math.round(w*RQ)),ah=Math.max(8,Math.round(h*RQ));

    P.maskKey='';
  });
  buildMasks();layoutData();
}
function buildMasks(){
  if(!gl)return;
  PANELS.forEach(function(P){
    var key=P.w+'x'+P.h+(fontReady?'F':'f');if(P.maskKey===key)return;
    if(P.k==='giant'){if(P.mask)gl.deleteTexture(P.mask);P.mask=giantMask(P);P.maskKey=key}
    if(P.k==='tagline'){if(P.mask)gl.deleteTexture(P.mask);P.mask=tagMask(P);P.maskKey=key}
  });
}
/* data layer geometry follows the light window */
var DP=null;
function layoutData(){
  DP=PANELS.filter(function(P){return P.k==='data'})[0];if(!DP)return;
  var w=DP.w,h=DP.h,W=Math.min(w*.6,h*.34),cy=h*.47,win=$('#win');
  win.style.left=(w-W)/2+'px';win.style.top=(cy-W/2)+'px';win.style.width=W+'px';win.style.height=W+'px';
  $('#rowFocus').style.top=(cy+W/2+18)+'px';$('#rowTilt').style.top=(cy+W/2+34)+'px';
  $('#ruler').style.bottom='44px';$('#bars').style.bottom='16px';
}
var FIXT=/[?&]t=([\d.]+)/.exec(location.search);FIXT=FIXT?parseFloat(FIXT[1])%CYCLE:null;
function clock(now){return REDUCE?null:FIXT!=null?FIXT:((now/1000)%CYCLE)}
var lastUI=0,fpsA=60,lastNow=0,FR=0,statsMs=0;
var dom={clk:$('#clk'),beats:[].slice.call(document.querySelectorAll('#beats i')),fx:$('#fx'),fy:$('#fy'),tx:$('#tx'),ty:$('#ty'),xh:$('#xh'),bars:[].slice.call(document.querySelectorAll('#bars s')),tclk:$('#tclk'),mode:$('#fieldMode')};
var lastStill=0;
function frame(now){
  requestAnimationFrame(frame);
  if(REDUCE&&now-lastStill<600)return;lastStill=now;
  var tc=clock(now),t0=performance.now();FR++;
  if(gl){
    var any=false;
    PANELS.forEach(function(P){
      var b=P.el.getBoundingClientRect();if(b.right<=0||b.left>=CW||!P.T)return;
      var t=tc==null?P.def.still:tc,S=P.def.state(P,t);P.last=S;
      lightPass(P,S);
      var vx=Math.round(b.left*DPR),vw=Math.round(b.width*DPR),vh=Math.round(b.height*DPR),vy=cv.height-Math.round((b.top)*DPR)-vh;
      composite(P,S,vx,vy,vw,vh);any=true;
      if(P.k==='data')dataUI(P,S,t);
      if(P.k==='field'&&dom.mode.textContent!==S.mode)dom.mode.textContent=S.mode;
    });
  }else{PANELS.forEach(function(P){var t=tc==null?P.def.still:tc;if(P.k==='data')dataUI(P,null,t)})}
  var t=tc==null?0:tc,bt=Math.floor(t/BEAT);
  if(now-lastUI>66||REDUCE){lastUI=now;dom.clk.textContent=REDUCE?'HOLD / 8.000':'T '+t.toFixed(3)+' / 8.000';dom.beats.forEach(function(e,i){e.classList.toggle('on',REDUCE?i===0:i===bt)})}
  statsMs+=(performance.now()-t0-statsMs)*.05;
}
function dataUI(P,S,t){
  var pl=EMB;if(!pl)return;
  var rc=S?S.rc:{cx:P.w/2,cy:P.h*.47,W:1,H:1},tl=S?S.tilt:[0,0],R=S?S.R:rotMat(0,0),sun=S?S.sun:[0,0,-1];
  var F=traceC(pl,rc,.5,.5,R,sun,pl.hpC*rc.W/pl.nx,pl.tC*rc.W/pl.nx,rc.W/Math.max(1,pl.NX-1))||[rc.cx,rc.cy];
  dom.xh.style.transform='translate('+F[0].toFixed(1)+'px,'+F[1].toFixed(1)+'px)';
  var ux=(F[0]-rc.cx)/rc.W,uy=(F[1]-rc.cy)/rc.W;
  dom.fx.textContent='X '+(ux>=0?'+':'-')+Math.abs(ux).toFixed(3);dom.fy.textContent='Y '+(uy>=0?'+':'-')+Math.abs(uy).toFixed(3);
  dom.tx.textContent=(tl[0]*57.2958>=0?'+':'-')+Math.abs(tl[0]*57.2958).toFixed(2)+'°';dom.ty.textContent=(tl[1]*57.2958>=0?'+':'-')+Math.abs(tl[1]*57.2958).toFixed(2)+'°';
  var a=Math.abs(tl[0])/.085,b2=Math.abs(tl[1])/.085,c=Math.min(1,Math.hypot(ux,uy)*6);
  [a,c,b2].forEach(function(v,i){dom.bars[i].style.width=(Math.min(1,v)*100).toFixed(1)+'%'});
  dom.tclk.textContent='T '+t.toFixed(2);
}

/* narrow screens: the reel advances itself on the beat, unless the viewer is scrolling it */
var touched=0;['pointerdown','wheel','touchstart'].forEach(function(e){reel.addEventListener(e,function(){touched=performance.now()},{passive:true})});
setInterval(function(){
  if(REDUCE||reel.scrollWidth<=reel.clientWidth+2||performance.now()-touched<9000)return;
  var w=PANELS[0].el.getBoundingClientRect().width,i=Math.round(reel.scrollLeft/w)+1;if(i*w>reel.scrollWidth-reel.clientWidth+2)i=0;
  reel.scrollTo({left:i*w,behavior:'smooth'});
},4000);

function boot(){
  if(fontReady)return;fontReady=true;
  WORD=wordTarget();EMB=emblemTarget();solve(WORD,96);solve(EMB,80);
  document.querySelectorAll('canvas.emb').forEach(function(c){var x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);drawEmblem(x,c.width,css('--light'))});
  buildMasks();
}
setupPanels();
/* until the font settles, plates are flat glass carrying a ripple: the light web shows immediately */
WORD=wide(new Plate('word0',200,50,null,15));EMB=wide(new Plate('emb0',92,92,null,27.6));WORD.done=EMB.done=false;WORD.fade=EMB.fade=0;
resize();
window.addEventListener('resize',function(){clearTimeout(window.__rz);window.__rz=setTimeout(resize,120)});
requestAnimationFrame(frame);
var bootT=setTimeout(function(){fontReady=false;boot()},1800);
try{
  if(document.fonts&&document.fonts.load)Promise.race([Promise.all([document.fonts.load('800 40px Syne'),document.fonts.load('400 10px "JetBrains Mono"')]),new Promise(function(r){setTimeout(r,1600)})]).then(function(){clearTimeout(bootT);boot()},function(){clearTimeout(bootT);boot()});
  else{clearTimeout(bootT);boot()}
}catch(e){clearTimeout(bootT);boot()}
window.__m2={W:function(){return WORD},E:function(){return EMB},trace:traceC,rot:rotMat,panels:function(){return PANELS.map(function(P){return {k:P.k,w:P.w,h:P.h}})},solved:function(){return {word:WORD&&WORD.done&&WORD.it,emb:EMB&&EMB.done&&EMB.it}},gl:function(){return !!gl},float:function(){return floatOK},ms:function(){return statsMs}};
})();
