<!doctype html>
<!--
  REGULA — typefaces as standards for natural processes.
  Site faces (whole series): Jost, a Futura revival - geometry built from circle, square and triangle, the
  emblem of standardised form - for names and headings; B612 Mono, drawn as a legibility standard for Airbus
  cockpit displays - a typeface as a working instrument - for axis readouts, units and numbers.
  The specimens are the typeface pages themselves, embedded live (?embed).
-->
<html lang="en" class="f2" style="--f-acc:#a9b8ff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regula</title>
<meta name="description" content="Regula: typefaces as standards for natural processes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.idx .law{display:block;margin-top:14px;font-size:12px;line-height:1.5;opacity:.7}
.idx .soon{opacity:.4}
.spec{position:relative;height:min(46vw,560px);border-radius:6px;overflow:hidden;background:#000}
.spec iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}
.spec a{position:absolute;inset:0;z-index:2}
.spec a:focus-visible{outline-offset:-6px}
.open{display:inline-block;margin-top:22px;font-family:var(--s-sans);font-weight:500;font-size:clamp(22px,2.2vw,32px);letter-spacing:-.015em}
.open:hover{text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.14em}
.cx-ch{background:#010c0e;color:#f2fff9}
.cx-ch .open{font-family:Unbounded,var(--s-sans);font-weight:300;letter-spacing:-.02em;text-shadow:-.03em 0 rgba(255,70,110,.35),.03em 0 rgba(70,160,255,.35),0 0 .35em rgba(98,217,199,.55)}
.cx-ch .spec{background:#021c1f;box-shadow:0 0 0 1px rgba(98,217,199,.18)}
.ph{height:min(30vw,320px);border:2px dashed currentColor;border-radius:6px;display:grid;place-items:center;opacity:.5;font-size:12px}
@media (max-width:760px){.spec{height:340px}.cx-ch{background:#010c0e;color:#f2fff9}
.cx-ch .open{font-family:Unbounded,var(--s-sans);font-weight:300;letter-spacing:-.02em;text-shadow:-.03em 0 rgba(255,70,110,.35),.03em 0 rgba(70,160,255,.35),0 0 .35em rgba(98,217,199,.55)}
.cx-ch .spec{background:#021c1f;box-shadow:0 0 0 1px rgba(98,217,199,.18)}
.ph{height:180px}}
</style>
</head>
<body>
<nav class="bar" aria-label="Site">
  <a class="tag series" href="index.html">regula</a>
  <span class="tag chap" id="chapTag"></span>
  <span class="sp"></span>
  <button class="btn" id="tryBtn">try</button>
  <a class="btn" href="caustic/index.html">next</a>
</nav>

<header class="ch f-acc" id="ch-open" data-tag="">
  <h1 class="huge">regula</h1>
  <p class="lede rv" style="margin-top:clamp(36px,6vh,72px)">Each typeface is a standard for a natural process. The law is the system; its parameters are the axes.</p>
  <div class="idx">
    <a href="#ch-caustic" class="rv"><span class="t">caustic</span></a>
    <a href="#ch-eroded" class="rv"><span class="t">eroded</span></a>
    <a href="#ch-evolved" class="rv"><span class="t">evolved</span></a>
  </div>
</header>

<section class="ch f-black" id="ch-try" data-tag="try">
  <h2 class="big rv">try</h2>
  <div class="ctl"><div class="g"><label class="l" for="line" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Type to set all three faces</label><input id="line" class="txtin" maxlength="24" placeholder="Regula" spellcheck="false" autocomplete="off" style="width:min(760px,90vw);font-size:clamp(28px,4vw,56px)"></div></div>
</section>

<section class="ch cx-ch" id="ch-caustic" data-tag="caustic">
  <h2 class="big rv" style="margin-bottom:32px">caustic</h2>
  <div class="spec"><iframe src="caustic/index.html?embed=1&amp;t=Caustic" title="Caustic, live" tabindex="-1"></iframe><a href="caustic/index.html" aria-label="Open Caustic"></a></div>
  <a class="open" href="caustic/index.html">caustic →</a>
</section>

<section class="ch f-paper" id="ch-eroded" data-tag="eroded">
  <h2 class="big rv" style="margin-bottom:32px">eroded</h2>
  <div class="spec"><iframe src="eroded/index.html?embed=1&amp;t=ERODED" title="Eroded, live" tabindex="-1"></iframe><a href="eroded/index.html" aria-label="Open Eroded"></a></div>
  <a class="open" href="eroded/index.html">eroded →</a>
</section>

<section class="ch f-black" id="ch-evolved" data-tag="evolved">
  <h2 class="big rv" style="margin-bottom:32px">evolved</h2>
  <div class="spec"><iframe id="evoFrame" src="evolved/index.html?embed=1&amp;t=EVOLVED" title="Evolved, live" tabindex="-1"></iframe><a href="evolved/index.html" aria-label="Open Evolved"></a></div>
  <a class="open" href="evolved/index.html">evolved →</a>
</section>

<footer class="foot f-acc"><span>regula</span><span>01 – 03</span></footer>
<script>
(function(){
  var inp=document.getElementById('line'),fr=document.querySelectorAll('.spec iframe'),t=0,tag=document.getElementById('chapTag');
  inp.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){
    var v=inp.value.trim();[].forEach.call(fr,function(f,i){try{f.contentWindow.postMessage({regulaText:v||(f.id==='evoFrame'?'Evolved':i===0?'Caustic':'ERODED')},'*')}catch(e){}});
  },250)});
  document.getElementById('tryBtn').onclick=function(){document.getElementById('ch-try').scrollIntoView({behavior:'smooth'});setTimeout(function(){inp.focus({preventScroll:true})},700)};
  function pick(){var vh=innerHeight,best=null,bh=0;document.querySelectorAll('.ch').forEach(function(s){var r=s.getBoundingClientRect(),h=Math.max(0,Math.min(vh,r.bottom)-Math.max(40,r.top));if(h>bh){bh=h;best=s}});var v=best?best.getAttribute('data-tag'):'';if(tag.textContent!==v)tag.textContent=v}
  addEventListener('scroll',pick,{passive:true});pick();
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});document.querySelectorAll('.rv').forEach(function(el){io.observe(el)})}
  else document.querySelectorAll('.rv').forEach(function(el){el.classList.add('in')});
})();
</script>
</body>
</html>
