<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Let the Rule Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Imagined things given a rule, sorted, repeated into patterns and grown into a series.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one screen, no page scroll. A menu bar on top, every work runs in the stage below it. */
:root{
  --bg:#E7E9E4;--plate:#F3F4F0;--fg:#121412;--mute:#5D625C;--rule:#BFC4BC;--accent:#2E43D6;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111311;--plate:#1A1D1A;--fg:#E9ECE6;--mute:#9AA097;--rule:#343933;--accent:#8C9BFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111311;--plate:#1A1D1A;--fg:#E9ECE6;--mute:#9AA097;--rule:#343933;--accent:#8C9BFF;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.menu{display:flex;align-items:stretch;border-bottom:1px solid var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home{font-weight:760;letter-spacing:-.03em;font-size:18px;padding:12px 18px 12px 0;border-right:1px solid var(--rule);white-space:nowrap}
.home em{font-style:normal;color:var(--accent)}
.tabs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.sub button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tabs button{padding:12px 16px;border-right:1px solid var(--rule);color:var(--mute)}
.tabs button .n{opacity:.55;margin-right:6px}
.tabs button:hover{color:var(--fg);background:var(--plate)}
.tabs button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.full{display:flex;align-items:center;padding:0 0 0 16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.full[hidden]{display:none}
.full:hover{color:var(--accent)}

.sub{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sub::-webkit-scrollbar{display:none}
.sub button{padding:9px 14px;color:var(--mute);border-right:1px solid var(--rule)}
.sub button:hover{color:var(--fg)}
.sub button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.menu{grid-row:1}.sub{grid-row:2}
.stage{grid-row:3;position:relative;min-height:0;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}

.intro{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vw,28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;max-width:1360px}
.kicker{font-size:clamp(20px,2.8vw,40px);font-weight:380;letter-spacing:-.02em;line-height:1.1;margin:0;color:var(--mute)}
.q{font-weight:760;font-size:clamp(42px,8.6vw,150px);line-height:.88;letter-spacing:-.045em;margin:0;text-wrap:balance;font-variation-settings:"opsz" 96}
.q em{font-style:normal;color:var(--accent)}
.steps{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0;padding:0;list-style:none;color:var(--mute);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.steps li+li::before{content:"\2192";color:var(--accent);margin-right:18px}
</style>
</head>
<body>
<nav class="menu" aria-label="Works">
  <button class="home" type="button">Rule<em>.</em></button>
  <div class="tabs" id="tabs">
    <button type="button" data-go="scroll-song"><span class="n">01</span>Scroll Song</button>
    <button type="button" data-go="return-line"><span class="n">02</span>Return Line</button>
    <button type="button" data-go="room-type"><span class="n">03</span>Room Type</button>
    <button type="button" data-go="chladni"><span class="n">04</span>Chladni</button>
    <button type="button" data-go="souvenir"><span class="n">05</span>Souvenir</button>
    <button type="button" data-go="type"><span class="n">06</span>Type</button>
  </div>
  <a class="full" id="full" href="#" target="_blank" rel="noopener" hidden>Full &#8599;</a>
</nav>
<div class="sub" id="sub" hidden>
  <button type="button" data-t="field-type">Field</button>
  <button type="button" data-t="grown-type">Grown</button>
  <button type="button" data-t="evolved-type">Evolved</button>
  <button type="button" data-t="slime-type">Slime</button>
  <button type="button" data-t="caustic-type">Caustic</button>
  <button type="button" data-t="latent-type">Latent</button>
  <button type="button" data-t="eroded-type">Eroded</button>
</div>
<main class="stage" id="stage">
  <section class="intro" id="intro">
    <p class="kicker">Something keeps happening in my head.</p>
    <h1 class="q">What if its rules became a <em>design process?</em></h1>
    <ol class="steps"><li>Rule</li><li>Order</li><li>Pattern</li><li>Series</li></ol>
  </section>
</main>

<script>
(function(){
  var FULL=window.WORK_FULL||{};
  var stage=document.getElementById('stage'),intro=document.getElementById('intro'),
      sub=document.getElementById('sub'),full=document.getElementById('full'),
      tabs=[].slice.call(document.querySelectorAll('#tabs button')),
      subs=[].slice.call(document.querySelectorAll('#sub button')),
      lastType='field-type',cur=null;
  function show(file){
    var f=stage.querySelector('iframe'); if(f) f.remove();
    if(!file){intro.hidden=false;full.hidden=true;return}
    intro.hidden=true;
    f=document.createElement('iframe');
    f.src='works/'+file+'.html'; f.title=file.replace('-',' ');
    f.setAttribute('allow','autoplay; fullscreen');
    stage.appendChild(f);
    full.href=FULL[file]||('works/'+file+'.html'); full.hidden=false;
  }
  function go(key){
    if(key==='type') key=lastType;
    var isType=/-type$/.test(key)&&key!=='room-type';
    if(isType) lastType=key;
    var tab=isType?'type':key;
    tabs.forEach(function(b){b.setAttribute('aria-current',(tab&&b.dataset.go===tab)?'true':'false')});
    subs.forEach(function(b){b.setAttribute('aria-current',b.dataset.t===key?'true':'false')});
    sub.hidden=!isType;
    if(key===cur) return;
    cur=key; show(key);
    try{history.replaceState(null,'',key?'#'+key:location.pathname+location.search)}catch(e){}
  }
  document.querySelector('.home').addEventListener('click',function(){go('')});
  tabs.forEach(function(b){b.addEventListener('click',function(){go(b.dataset.go)})});
  subs.forEach(function(b){b.addEventListener('click',function(){go(b.dataset.t)})});
  go((location.hash||'').slice(1));
  window.addEventListener('hashchange',function(){go(location.hash.slice(1))});
})();
</script>
</body>
</html>
