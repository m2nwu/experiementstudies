<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Word, Seven Laws</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="One word carried through seven laws and eleven art styles, collected as a matrix.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One stage, one word. Seven laws make it, eleven styles dress it, eight modifiers bend it; the matrix keeps what you saw. */
:root{
  --bg:#E7E9E4;--plate:#F3F4F0;--fg:#121412;--mute:#5D625C;--rule:#BFC4BC;--accent:#2E43D6;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));--gutR:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111311;--plate:#1A1D1A;--fg:#E9ECE6;--mute:#9AA097;--rule:#343933;--accent:#8C9BFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111311;--plate:#1A1D1A;--fg:#E9ECE6;--mute:#9AA097;--rule:#343933;--accent:#8C9BFF;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden;height:100dvh;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.word:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}

/* stage: the law runs in the frame (invisible while a style is on, still taking the hand); the style is painted over it */
.stage{position:relative;min-height:0;overflow:hidden;background:#121412}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent;z-index:0}
.stage.styled iframe{opacity:0}
.sty{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;display:block}
.stage:not(.styled) .sty{visibility:hidden}
.veil{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.tag{position:absolute;left:0;bottom:0;z-index:3;display:flex;align-items:stretch;background:var(--bg);color:var(--fg);
  border-top:1px solid var(--fg);border-right:1px solid var(--fg);max-width:calc(100% - 16px)}
.idx{display:flex;align-items:center;padding:0 10px 0 var(--gut);font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.word{position:relative;display:flex;align-items:center;gap:2px;padding:0 14px 0 4px;cursor:text;min-width:0;
  font-weight:680;font-size:15px;letter-spacing:.14em;line-height:1;height:34px;white-space:nowrap;overflow:hidden}
.word input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
.caret{display:block;width:1.5px;height:1.15em;background:currentColor;opacity:.55}
.word.on .caret{opacity:1;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* bar: laws + word | styles | modifiers | matrix + export */
.bar{display:flex;align-items:center;gap:14px;border-top:1px solid var(--fg);
  padding:8px var(--gutR) calc(8px + env(safe-area-inset-bottom,0px)) var(--gut)}
.grp{display:flex;align-items:center;min-width:0}
.g-out{margin-left:auto;gap:6px}
.ib{display:flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 auto;color:var(--mute);position:relative}
.ib:hover{color:var(--fg);background:var(--plate)}
.ib[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.dock .ib.seen::after{content:"";position:absolute;left:50%;bottom:4px;width:3px;height:3px;margin-left:-1.5px;background:var(--accent)}
.dock .ib[aria-pressed="true"].seen::after{background:var(--bg)}
.dock{display:flex}
.sep{width:1px;height:26px;background:var(--rule);margin:0 4px;flex:0 0 auto}
.g-sty,.g-mod{gap:2px}
.sw{width:34px;height:40px;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.sw canvas,.sw i{display:block;width:26px;height:26px;border-radius:2px;box-shadow:0 0 0 1px var(--rule)}
.sw i{background:var(--plate)}
.sw svg.i{width:20px;height:20px;color:var(--mute)}
.sw:hover canvas,.sw:hover svg.i{box-shadow:0 0 0 1px var(--fg);color:var(--fg)}
.sw[aria-pressed="true"]::after{content:"";position:absolute;left:3px;right:3px;bottom:0;height:2px;background:var(--fg)}
.sw[aria-pressed="true"] canvas{box-shadow:0 0 0 2px var(--fg)}
.sw[aria-pressed="true"] svg.i{color:var(--fg)}
.mod{width:36px;height:40px}
.mod svg.i{width:20px;height:20px}
.export{color:var(--fg);box-shadow:inset 0 0 0 1px var(--rule)}
.export:disabled{color:var(--rule);cursor:default;background:none}
#mxb canvas{width:22px;height:14px;display:block;image-rendering:pixelated}

/* matrix: 7 laws x 11 styles, filled by visiting */
.mx{position:absolute;right:0;bottom:0;z-index:4;background:var(--bg);color:var(--fg);border-top:1px solid var(--fg);border-left:1px solid var(--fg);
  padding:12px var(--gutR) 12px 12px;width:min(760px,100%);max-height:100%;overflow:auto}
.mxg{display:grid;grid-template-columns:26px repeat(11,minmax(0,1fr));gap:3px}
.mxh{display:flex;align-items:center;justify-content:center;height:26px;color:var(--mute)}
.mxh canvas{width:18px;height:18px;display:block;border-radius:2px}
.mxh svg.i{width:16px;height:16px}
.mc{position:relative;aspect-ratio:16/10;background:var(--plate);box-shadow:inset 0 0 0 1px var(--rule);overflow:hidden;min-width:0}
.mc canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mc.stale canvas{opacity:.35;filter:grayscale(1)}
.mc:hover{box-shadow:inset 0 0 0 1px var(--fg)}
.mc[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.mxf{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.mxn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums}

@media (max-width:1240px){
  .bar{flex-wrap:wrap;row-gap:4px}
  .g-law{order:1}.g-out{order:2}.g-sty{order:3}.g-mod{order:4;margin-left:auto}
}
@media (max-width:760px){
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"law law" "sty sty" "mod out";gap:2px 6px;padding-top:4px}
  .g-law{grid-area:law}.g-sty{grid-area:sty}.g-mod{grid-area:mod;margin-left:0}.g-out{grid-area:out;margin-left:0;gap:4px}
  .g-law .dock{flex:1;justify-content:space-between}
  .ib{width:40px;height:40px}
  .g-law .sep{display:none}
  .g-sty{justify-content:space-between}
  .sw{width:auto;flex:1 1 0;height:34px}
  .sw canvas,.sw i{width:22px;height:22px}
  .mod{width:auto;flex:1 1 0;height:38px}
  .g-out .ib{width:38px;height:38px}
  .mx{width:100%;padding:10px var(--gutR) 10px var(--gut)}
  .mxg{grid-template-columns:20px repeat(11,minmax(0,1fr));gap:2px}
}
@media (prefers-reduced-motion: reduce){.word.on .caret{animation:none}}
</style>
</head>
<body>
<main class="stage styled" id="stage">
  <canvas class="sty" id="sty" aria-hidden="true"></canvas>
  <canvas class="sty" id="ovl" aria-hidden="true"></canvas>
  <canvas class="veil" id="veil" aria-hidden="true"></canvas>
  <div class="tag"><div class="idx" id="idx" aria-hidden="true">01</div>
  <label class="word" id="wordBox" title="Word"><span id="wordOut">RULE</span><i class="caret" aria-hidden="true"></i><input id="word" maxlength="12" value="RULE" spellcheck="false" autocomplete="off" autocapitalize="characters" enterkeyhint="done" aria-label="Word"></label></div>
  <section class="mx" id="mx" hidden aria-label="Matrix">
    <div class="mxg" id="mxg"></div>
    <div class="mxf"><span class="mxn" id="mxn" aria-label="Combinations seen">00/77</span>
      <button class="ib export" id="export" type="button" aria-label="Export matrix PNG" title="Export matrix PNG" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 19h16"/></svg></button></div>
  </section>
</main>
<nav class="bar" aria-label="Controls">
  <div class="grp g-law"><div class="dock" id="dock" role="group" aria-label="Laws"></div><span class="sep" aria-hidden="true"></span>
    <button class="ib" id="edit" type="button" aria-label="Edit word" title="Edit word"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4h7M8.5 20h7M12 4v16"/></svg></button></div>
  <div class="grp g-sty" id="styles" role="group" aria-label="Styles"></div>
  <div class="grp g-mod" id="mods" role="group" aria-label="Modifiers"></div>
  <div class="grp g-out">
    <button class="ib" id="mxb" type="button" aria-label="Matrix" title="Matrix  ⇧0" aria-pressed="false" aria-controls="mx"><canvas width="22" height="14" aria-hidden="true"></canvas></button>
    <button class="ib export" id="export2" type="button" aria-label="Export matrix PNG" title="Export matrix PNG" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 19h16"/></svg></button>
  </div>
</nav>

<script>
(function(){
'use strict';
/* ---------- style shaders: one program per style, sharing a prelude (mask, warp) and a post (modifiers) ---------- */
var GL_PRE=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uF,uD,uM,uN,uA;
uniform vec2 uRes,uMT,uPtr;
uniform float uT,uG1,uG2,uTh,uU,uSeed,uR1,uLn;
uniform vec4 uRoi,uBox;
uniform vec4 uLet[12];
uniform float uMod[8];
uniform vec3 uBg,uInk,uInk2;
#define PI 3.14159265
float mBio,mKin,mSin,mAnt,mMic,mLoc,mAnti,mAir;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec2(17.1,9.7);a*=.5;}return s;}
vec3 vor(vec2 p){vec2 i=floor(p),f=fract(p);float d1=8.,d2=8.,id=0.;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));vec2 o=vec2(h21(i+g),h21(i+g+31.7));vec2 r=g+o-f;float d=dot(r,r);
    if(d<d1){d2=d1;d1=d;id=h21(i+g+7.3);}else if(d<d2)d2=d;}
  return vec3(sqrt(d1),sqrt(d2)-sqrt(d1),id);}
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float m1(vec2 uv){return clamp(texture2D(uM,uv).r*uG1,0.,1.);}
float m2(vec2 uv){return clamp(texture2D(uN,uv).r*uG2,0.,1.);}
float MK(vec2 uv){float m=m1(uv);
  if(mBio>0.){float b=m2(uv)*1.25+(fbm(uv*vec2(uRes.x/uRes.y,1.)*7.+uT*.12*mKin)-.5)*.42;m=mix(m,max(m,b),mBio);}
  return m;}
float STR(vec2 uv){return texture2D(uD,uv).r;}
vec2 GR(vec2 uv){vec2 e=uMT*1.5;return vec2(MK(uv+vec2(e.x,0.))-MK(uv-vec2(e.x,0.)),MK(uv+vec2(0.,e.y))-MK(uv-vec2(0.,e.y)))/(2.*e*uRes);}
vec2 GR1(vec2 uv){vec2 e=uMT*1.5;return vec2(m1(uv+vec2(e.x,0.))-m1(uv-vec2(e.x,0.)),m1(uv+vec2(0.,e.y))-m1(uv-vec2(0.,e.y)))/(2.*e*uRes);}
vec2 GR2(vec2 uv){vec2 e=uMT*5.;return vec2(m2(uv+vec2(e.x,0.))-m2(uv-vec2(e.x,0.)),m2(uv+vec2(0.,e.y))-m2(uv-vec2(0.,e.y)))/(2.*e*uRes);}
float cv(float m,float c,vec2 g){return clamp((m-c)/max(length(g),1e-5)+.5,0.,1.);}
float iso(float m,float c,vec2 g,float w){float d=abs(m-c)/max(length(g),1e-5);return 1.-smoothstep(w*.5,w*.5+1.,d);}
float ROI(vec2 uv){return smoothstep(uRoi.y-.01,uRoi.y+.01,uv.y)*smoothstep(uRoi.w+.03,uRoi.w-.01,uv.y);}
vec2 nrmG(vec2 g){return g*uRes.y*uR1*2.2;}
vec2 warp(vec2 uv){
  vec2 p=uv;float a=uRes.x/uRes.y;
  if(mSin>0.){p.x+=mSin*.010*sin(p.y*13.+uT*1.1);p.y+=mSin*.020*sin(p.x*a*6.5-uT*.8);}
  if(mKin>0.){vec2 c=(uBox.xy+uBox.zw)*.5;vec2 q=(p-c)*vec2(a,1.);q=rot(.03*sin(uT*.7))*q*(1.+.025*sin(uT*1.7));
    p=mix(p,c+q/vec2(a,1.)+vec2(.008*sin(uT*.5),.010*cos(uT*.63)),mKin);}
  if(mAnti>0.){float tq=floor(uT*5.);p+=mAnti*(vec2(vn(p*4.+tq*.37),vn(p*4.+11.+tq*.53))-.5)*.010;}
  return p;}
float bayer4(vec2 c){vec2 a=mod(c,2.),b=mod(floor(c*.5),2.);return (4.*mod(2.*a.x+3.*a.y,4.)+mod(2.*b.x+3.*b.y,4.)+.5)/16.;}
`;

var GL_POST=`
vec3 post(vec3 c,vec2 uv,vec2 w,float m,vec2 g,float L){
  vec2 p=uv*uRes;float U=uU;float h2=m2(w);
  float gh=texture2D(uD,uv).g*(1.-ROI(uv));
  c=mix(c,uInk,gh*.45);
  if(mBio>0.){
    vec2 g2=GR2(w);
    float mem=iso(h2,.2,g2,1.8*U+.4)*(1.-L);
    float mem2=iso(h2,.13,g2,1.*U+.3)*(1.-L);
    c=mix(c,uInk2,(.75*mem+.4*mem2)*mBio);
    vec3 v=vor(p/(13.*U)+uSeed);
    float ves=(1.-smoothstep(.6*U,1.6*U,abs(v.x*13.*U-3.2*U)))*step(.07,h2)*step(h2,.3)*step(v.z,.45)*(1.-L);
    c=mix(c,uInk2,ves*.8*mBio);
  }
  if(mMic>0.){
    float cs=17.*U;vec2 cell=floor(p/cs);vec2 f=p-(cell+.5)*cs;vec2 cu=(cell+.5)*cs/uRes;float mc=MK(cu);
    float edge=step(uTh+.03,mc)*step(mc,uTh+.26);
    float r=length(f);float riv=(1.-smoothstep(2.3*U,2.3*U+1.,r))*edge;
    vec3 rc=mix(mix(uInk,uBg,.25),vec3(1.),.55*(1.-smoothstep(0.,1.6*U,length(f+vec2(.8*U)))));
    c=mix(c,rc,riv*mMic);
    c=mix(c,uInk,edge*(1.-smoothstep(.3,1.,abs(r-3.4*U)))*.5*mMic);
    float halo=smoothstep(.05,.16,h2)*(1.-smoothstep(.32,.5,h2))*(1.-L);
    float hat=1.-smoothstep(.35,1.1,abs(mod(p.x+p.y,6.*U)-3.*U));
    c=mix(c,uInk,.42*halo*hat*mMic);
    float ins=13.*U,tk=8.*U;float ix=mod(p.x,tk),iy=mod(p.y,tk);
    float maj=step(mod(floor(p.x/tk),5.),.5),majy=step(mod(floor(p.y/tk),5.),.5);
    float tx=(1.-smoothstep(.4,1.,ix))*step(ins,p.y)*step(p.y,ins+mix(3.5,8.,maj)*U)+(1.-smoothstep(.4,1.,ix))*step(uRes.y-ins-mix(3.5,8.,maj)*U,p.y)*step(p.y,uRes.y-ins);
    float ty=(1.-smoothstep(.4,1.,iy))*step(uRes.x-ins-mix(3.5,8.,majy)*U,p.x)*step(p.x,uRes.x-ins);
    c=mix(c,uInk,.75*clamp(tx+ty,0.,1.)*mMic);
    for(int k=0;k<4;k++){vec2 cc=vec2(k==0||k==3?uBox.x-.025:uBox.z+.025,k<2?uBox.y-.04:uBox.w+.04)*uRes;vec2 d=abs(p-cc);
      float cr=(1.-smoothstep(.35,1.,min(d.x,d.y)))*step(max(d.x,d.y),9.*U)+(1.-smoothstep(.35,1.,abs(length(p-cc)-4.5*U)));
      c=mix(c,uInk,.8*clamp(cr,0.,1.)*mMic);}
  }
  if(mAir>0.){
    float halo=smoothstep(.0,.55,h2)*(1.-L);
    float gr=h21(floor(p*.5)*1.7+floor(uT*3.*mKin));
    float spray=step(gr,halo*halo*.6);
    c=mix(c,uInk2,.28*halo*mAir);
    c=mix(c,mix(uInk2,vec3(1.),.2),spray*.7*mAir);
    float vy=smoothstep(uBox.y,uBox.w,uv.y);
    c=mix(c,mix(c,uInk2,.75),L*mAir*vy*.6);
    c=mix(c,vec3(1.),L*mAir*(1.-vy)*.18);
  }
  if(mAnti>0.){
    float blot=smoothstep(.55,.8,fbm(p/(20.*U)+uSeed));
    float dry=step(.80,vn(p*vec2(.07,.8)/U));
    c=mix(c,uBg,L*(blot*.45+dry*.3)*mAnti);
    float Lm=cv(MK(w+vec2(5.,-3.)*U/uRes),uTh,g);
    c=mix(c,uInk2,clamp(Lm-L,0.,1.)*.75*mAnti);
  }
  return c;
}
void main(){
  mBio=uMod[0];mKin=uMod[1];mSin=uMod[2];mAnt=uMod[3];mMic=uMod[4];mLoc=uMod[5];mAnti=uMod[6];mAir=uMod[7];
  vec2 uv=vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y);
  vec2 w=warp(uv);
  float m=MK(w);vec2 g=GR(w);float L=cv(m,uTh,g);
  vec3 c=style(uv,w,m,g,L);
  c=post(c,uv,w,m,g,L);
  gl_FragColor=vec4(clamp(c,0.,1.),1.);
}
`;

var GL_STYLE={};

/* GZHEL: cobalt underglaze on porcelain, loaded-brush strokes, teardrop petals, rope borders */
GL_STYLE.gzhel=`
vec3 style(vec2 uv,vec2 w,float m,vec2 g,float L){
  float U=uU;vec2 p=w*uRes;float a=uRes.x/uRes.y;
  vec3 white=vec3(.968,.970,.962),cob=vec3(.04,.11,.46),mid=vec3(.16,.32,.76),pale=vec3(.80,.86,.98);
  vec3 c=white-vec3(.06,.05,.0)*length((uv-.5)*vec2(a,1.))*.55;
  c+=.035*exp(-pow((uv.x*.8-uv.y*.35-.25)*5.,2.));
  float cs=34.*U;vec2 ci=floor(p/cs);
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
    vec2 id=ci+vec2(float(x),float(y));float hh=h21(id+uSeed);
    vec2 o=(id+.2+.6*vec2(h21(id+3.1),h21(id+5.7)))*cs;vec2 ou=o/uRes;
    float mo=m2(ou);if(hh<.22||mo<.10||mo>.75||m1(ou)>uTh-.04)continue;
    vec2 go=GR2(ou);vec2 dir=-normalize(go+1e-6);dir=rot((hh-.6)*1.3)*dir;
    vec2 q=p-o;float al=dot(q,dir),sd=dot(q,vec2(-dir.y,dir.x));
    float len=(16.+18.*h21(id+9.))*U;float t=clamp(al/len,0.,1.);
    float rad=mix(7.*U,.5*U,pow(t,.7));
    float d=length(vec2(al-t*len,sd))-rad;
    float pe=1.-smoothstep(-.6,.8,d);
    vec3 pc=mix(cob,pale,smoothstep(.05,.95,t+.18*sd/(6.*U)));
    c=mix(c,pc,pe);
  }
  c=mix(c,cob,iso(m,uTh-.12,g,1.3*U+.5)*.9);
  vec2 n=normalize(g+1e-6);float e=1.-smoothstep(uTh,uTh+.42,m);
  float side=dot(n,normalize(vec2(.55,.83)));
  float streak=vn(vec2(dot(p,vec2(.71,.71))*.03/U,dot(p,vec2(-.71,.71))*.55/U));
  float tone=clamp(.5+.62*side*(.45+.55*e)+(streak-.5)*.3+STR(w)*.25,0.,1.);
  vec3 lc=mix(pale,mid,smoothstep(0.,.5,tone));lc=mix(lc,cob,smoothstep(.5,1.,tone));
  c=mix(c,lc,L);
  float bh=12.*U,y0=16.*U;
  for(int k=0;k<2;k++){
    float yy=(k==0?p.y:uRes.y-p.y)-y0;
    if(yy>-6.*U&&yy<bh+14.*U){
      float s=fract((p.x+yy*1.2)/(10.*U));float strand=sin(s*PI);
      float inb=step(0.,yy)*step(yy,bh);
