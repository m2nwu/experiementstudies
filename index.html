<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Let the Rule Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Imagined things given a rule, sorted, repeated into patterns and grown into a series.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one screen, no page scroll. A menu bar on top, every work runs in the stage below it. */
:root{
  --bg:#E7E9E4;--plate:#F3F4F0;--fg:#121412;--mute:#5D625C;--rule:#BFC4BC;--accent:#2E43D6;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111311;--plate:#1A1D1A;--fg:#E9ECE6;--mute:#9AA097;--rule:#343933;--accent:#8C9BFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111311;--plate:#1A1D1A;--fg:#E9ECE6;--mute:#9AA097;--rule:#343933;--accent:#8C9BFF;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.menu{display:flex;align-items:stretch;border-bottom:1px solid var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ib{display:flex;align-items:center;justify-content:center;width:48px;height:46px;flex:0 0 auto;color:var(--mute);border-right:1px solid var(--rule)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{color:var(--fg);background:var(--plate)}
.home{color:var(--fg);border-left:1px solid var(--rule)}
.tabs .ib[aria-current="true"]{background:var(--fg);color:var(--bg)}
.sub .ib{height:40px}
.sub .ib[aria-current="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.full{margin-left:auto;border-right:0;border-left:1px solid var(--rule)}
.tabs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

.sub{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sub::-webkit-scrollbar{display:none}

.menu{grid-row:1}.sub{grid-row:2}
.stage{grid-row:3;position:relative;min-height:0;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}

.intro{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vw,28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;max-width:1360px}
.kicker{font-size:clamp(20px,2.8vw,40px);font-weight:380;letter-spacing:-.02em;line-height:1.1;margin:0;color:var(--mute)}
.q{font-weight:760;font-size:clamp(42px,8.6vw,150px);line-height:.88;letter-spacing:-.045em;margin:0;text-wrap:balance;font-variation-settings:"opsz" 96}
.q em{font-style:normal;color:var(--accent)}
.steps{display:flex;align-items:center;gap:18px;margin:0;padding:0;list-style:none;color:var(--fg)}
.steps li{display:flex;align-items:center;gap:18px}
.steps li+li::before{content:"\2192";color:var(--accent);font-family:var(--mono)}
.steps svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<nav class="menu" aria-label="Works">
  <button class="home ib" type="button" aria-label="Question" title="Question"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="M4 20L20 4"/></svg></button>
  <div class="tabs" id="tabs">
    <button class="ib" type="button" data-go="scroll-song" aria-label="Scroll Song" title="Scroll Song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v17M6 20l-3-3M6 20l3-3"/><path d="M13 16V6l7-2v10"/><circle cx="11.2" cy="16" r="1.8"/><circle cx="18.2" cy="14" r="1.8"/></svg></button>
    <button class="ib" type="button" data-go="return-line" aria-label="Return Line" title="Return Line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18H9l6-12h5.5"/><circle cx="3.5" cy="18" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="20.5" cy="6" r="1.6"/></svg></button>
    <button class="ib" type="button" data-go="room-type" aria-label="Room Type" title="Room Type"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M8 17l4-10 4 10M9.4 13.5h5.2"/></svg></button>
    <button class="ib" type="button" data-go="chladni" aria-label="Chladni" title="Chladni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 12c4-3.5 14-3.5 18 0M12 3c-3.5 4-3.5 14 0 18"/></svg></button>
    <button class="ib" type="button" data-go="souvenir" aria-label="Souvenir" title="Souvenir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
    <button class="ib" type="button" data-go="type" aria-label="Type" title="Type"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19L8 5l5 14M5 14.5h6"/><circle cx="17.6" cy="15.6" r="3.1"/><path d="M20.7 12.2V19"/></svg></button>
  </div>
  <a class="full ib" id="full" href="#" target="_blank" rel="noopener" aria-label="Open full screen" title="Full screen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M10 4H4v16h16v-6"/></svg></a>
</nav>
<div class="sub" id="sub" hidden>
  <button class="ib" type="button" data-t="field-type" aria-label="Field Type" title="Field Type"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M6 8h3.2M14.8 8H18"/></svg></button>
  <button class="ib" type="button" data-t="grown-type" aria-label="Grown Type" title="Grown Type"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4.2 3-7 7-7 0 4.2-3 7-7 7zM12 15c0-3.2-2.3-5.4-6-5.4 0 3.2 2.3 5.4 6 5.4z"/></svg></button>
  <button class="ib" type="button" data-t="evolved-type" aria-label="Evolved Type" title="Evolved Type"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-6M12 15l-6-5M12 15l6-5M6 10V5M6 10L3 7M18 10V5M18 10l3-3"/></svg></button>
  <button class="ib" type="button" data-t="slime-type" aria-label="Slime Type" title="Slime Type"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="12" cy="13" r="1.6"/><circle cx="6" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/><path d="M6.2 7.1C9 8.8 10.5 10.6 11.1 11.8M18 6.3c-2 2.6-3.8 4.6-4.9 5.7M10.9 14.2c-1.6 1.6-3 3-3.8 3.7M13.3 13.9c2.3.8 3.8 2.4 4.7 3.8"/></svg></button>
  <button class="ib" type="button" data-t="caustic-type" aria-label="Caustic Type" title="Caustic Type"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7c5-3.2 11-3.2 16 0"/><path d="M6.5 8.2L11 20M17.5 8.2L13 20M12 8.5V20"/></svg></button>
  <button class="ib" type="button" data-t="latent-type" aria-label="Latent Type" title="Latent Type"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke-opacity=".35"/><circle cx="13" cy="11" r="2.2" fill="currentColor"/></svg></button>
  <button class="ib" type="button" data-t="eroded-type" aria-label="Eroded Type" title="Eroded Type"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19l6-9 4 5 3-4 7 8z"/><path d="M6.4 15.6c1.6-.9 3-.9 4.3.2"/></svg></button>
</div>
<main class="stage" id="stage">
  <section class="intro" id="intro">
    <p class="kicker">Something keeps happening in my head.</p>
    <h1 class="q">What if its rules became a <em>design process?</em></h1>
    <ol class="steps"><li title="Rule" aria-label="Rule"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="6"/><path d="M7 9v3M11 9v3M15 9v3M19 9v2"/></svg></li><li title="Order" aria-label="Order"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-5M10 20v-9M15 20v-12M20 20V4"/></svg></li><li title="Pattern" aria-label="Pattern"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg></li><li title="Series" aria-label="Series"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="8" width="5.5" height="8"/><rect x="9.25" y="8" width="5.5" height="8"/><rect x="16.5" y="8" width="5.5" height="8"/></svg></li></ol>
  </section>
</main>

<script>
(function(){
  var FULL=window.WORK_FULL||{};
  var stage=document.getElementById('stage'),intro=document.getElementById('intro'),
      sub=document.getElementById('sub'),full=document.getElementById('full'),
      tabs=[].slice.call(document.querySelectorAll('#tabs button')),
      subs=[].slice.call(document.querySelectorAll('#sub button')),
      lastType='field-type',cur=null;
  function show(file){
    var f=stage.querySelector('iframe'); if(f) f.remove();
    if(!file){intro.hidden=false;full.hidden=true;return}
    intro.hidden=true;
    f=document.createElement('iframe');
    f.src='works/'+file+'.html'; f.title=file.replace('-',' ');
    f.setAttribute('allow','autoplay; fullscreen');
    stage.appendChild(f);
    full.href=FULL[file]||('works/'+file+'.html'); full.hidden=false;
  }
  function go(key){
    if(key==='type') key=lastType;
    var isType=/-type$/.test(key)&&key!=='room-type';
    if(isType) lastType=key;
    var tab=isType?'type':key;
    tabs.forEach(function(b){b.setAttribute('aria-current',(tab&&b.dataset.go===tab)?'true':'false')});
    subs.forEach(function(b){b.setAttribute('aria-current',b.dataset.t===key?'true':'false')});
    sub.hidden=!isType;
    if(key===cur) return;
    cur=key; show(key);
    try{history.replaceState(null,'',key?'#'+key:location.pathname+location.search)}catch(e){}
  }
  document.querySelector('.home').addEventListener('click',function(){go('')});
  tabs.forEach(function(b){b.addEventListener('click',function(){go(b.dataset.go)})});
  subs.forEach(function(b){b.addEventListener('click',function(){go(b.dataset.t)})});
  go((location.hash||'').slice(1));
  window.addEventListener('hashchange',function(){go(location.hash.slice(1))});
})();
</script>
</body>
</html>
