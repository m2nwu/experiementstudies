<!doctype html>
<!--
  TYPE EXPERIMENT — typefaces as standards for natural processes.
  Site faces (whole series): Jost, a Futura revival - geometry built from circle, square and triangle, the
  emblem of standardised form - for names and headings; B612 Mono, drawn as a legibility standard for Airbus
  cockpit displays - a typeface as a working instrument - for axis readouts, units and numbers.
  The home is one screen: the opening and its index; each name opens its typeface page.
-->
<html lang="en" class="f2" style="--f-acc:#ffffff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TYPE EXPERIMENT</title>
<meta name="description" content="Type Experiment: typefaces as standards for natural processes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.idx .t{text-transform:uppercase;letter-spacing:.01em}
body,.tag,.btn,.lede{text-transform:uppercase}
.lede{letter-spacing:.005em}
.huge.hx{font-size:min(12.6vw,26vh);line-height:.92;letter-spacing:-.01em}
@media (max-width:760px){.huge.hx{font-size:14.2vw}}

html,body{height:100%}
html{background:var(--f-acc)}
body{display:flex;flex-direction:column;min-height:100%;background:var(--f-acc)}
#ch-open{flex:1 0 auto;position:relative}

.bar{background:#fff}
.bar .btn{background:#fff;box-shadow:inset 0 0 0 1px #000}
.tag.series{box-shadow:inset 0 0 0 1px #000}
</style>
</head>
<body>
<nav class="bar" aria-label="Site">
  <a class="tag series" href="index.html">TYPE EXPERIMENT</a>
  <span class="sp"></span>
  <a class="btn" href="caustic/index.html">TRY</a>
  <a class="btn" href="caustic/index.html">NEXT</a>
</nav>

<header class="ch f-acc" id="ch-open" data-tag="">
  <h1 class="huge hx">TYPE EXPERIMENT</h1>
  <p class="lede rv" style="margin-top:clamp(36px,6vh,72px)">EACH TYPEFACE IS A STANDARD FOR A NATURAL PROCESS. THE LAW IS THE SYSTEM; ITS PARAMETERS ARE THE AXES.</p>
  <div class="idx">
    <a href="caustic/index.html" class="rv"><span class="t">CAUSTIC</span></a>
    <a href="eroded/index.html" class="rv"><span class="t">ERODED</span></a>
    <a href="evolved/index.html" class="rv"><span class="t">EVOLVED</span></a>
  </div>
</header>

<script>
(function(){
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});document.querySelectorAll('.rv').forEach(function(el){io.observe(el)})}
  else document.querySelectorAll('.rv').forEach(function(el){el.classList.add('in')});
})();
</script>
</body>
</html>
